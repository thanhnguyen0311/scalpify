spring.application.name=spring-react-backend
server.port=${PORT:8080}

# MySQL settings. The demo API uses in-memory sample data;
# these settings are ready for adding JPA persistence.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sample_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
